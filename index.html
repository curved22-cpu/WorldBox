<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сага — симулятор жизни</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="setup-screen"></div>

  <div id="game-ui" style="display:none">
    <div id="topbar">
      <div id="year-display">Год 0</div>
      <div id="pop-display">👥 0 · 🏘 0</div>
      <div id="speed-row"></div>
      <label id="live-toggle-label"><input type="checkbox" id="live-toggle" /> Жить без меня</label>
      <button id="new-game-btn" title="Новая сага">🔄 Новая сага</button>
    </div>

    <div id="event-feed"></div>
    <div id="inspector" style="display:none"></div>

    <div id="zoom-controls">
      <button id="zoom-in-btn" title="Приблизить">+</button>
      <button id="zoom-out-btn" title="Отдалить">−</button>
    </div>

    <div id="help">
      ЛКМ — выбрать · ПКМ/колёсико — камера · два пальца — камера/зум на телефоне
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
